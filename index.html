<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RABDAN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif;padding-bottom:68px}
button{cursor:pointer}
button:disabled{opacity:.5}
header{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;background:#090909;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:900;letter-spacing:3px}
.logo span{color:#aaa}
.topbutton{background:none;border:0;color:white;font-size:13px}
main{max-width:540px;margin:auto}
.page{display:none;padding:18px}
.page.active{display:block}
#explorePage{padding:0}
.sectiontitle{font-size:22px;font-weight:bold;margin:10px 0 20px}
input,textarea{width:100%;padding:14px;background:#171717;border:1px solid #333;border-radius:10px;color:white;margin:8px 0;font-size:15px}
textarea{height:100px;resize:vertical}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:bold;font-size:15px;margin-top:10px}
.secondary{width:100%;padding:13px;border:1px solid #555;border-radius:10px;background:transparent;color:white;margin-top:10px}
.authbox{padding:22px 18px;margin:30px 12px;background:#121212;border:1px solid #292929;border-radius:16px}
.authlogo{text-align:center;font-size:32px;font-weight:900;letter-spacing:4px;margin:15px}
.muted{color:#888;font-size:13px;line-height:1.7}
#authMessage{font-size:13px;color:#ccc;margin-top:12px;line-height:1.6}
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#101010;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom button{background:none;border:0;color:#aaa;font-size:23px;min-width:55px}
.bottom button.active{color:white}
.empty{text-align:center;color:#888;padding:35px 10px}
.followbtn{padding:9px 13px;border-radius:8px;border:1px solid #555;background:transparent;color:white;font-weight:bold}
.followbtn.following{background:#eee;color:#111;border-color:#eee}
/* EXPLORE */
#videoFeed{height:calc(100dvh - 125px);height:calc(100vh - 125px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.video-card{height:100%;min-height:450px;position:relative;scroll-snap-align:start;background:#111;overflow:hidden}
.video-card video{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.video-gradient{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.8));pointer-events:none}
.video-info{position:absolute;bottom:22px;right:16px;left:85px;z-index:2}
.video-user{font-size:15px;font-weight:bold;margin-bottom:8px;cursor:pointer}
.video-caption{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.video-date{font-size:11px;color:#ddd;margin-top:8px}
.video-actions{position:absolute;bottom:35px;left:13px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:20px}
.video-actions button{background:rgba(0,0,0,.35);border:0;color:white;font-size:27px;border-radius:50%;width:48px;height:48px}
.video-actions button:active{transform:scale(.9)}
.video-actions small{font-size:11px;color:white;margin-top:-17px}
.sound-button{font-size:21px!important}
.like-button{transition:transform .15s,color .15s}
.like-button[data-liked="true"]{color:#ff3158}
.video-follow{font-size:12px;padding:7px 10px;background:#fff;color:#111;border:0;border-radius:7px;margin-top:8px;font-weight:bold}
.video-follow.following{background:#333;color:white}
.upload-box{background:#151515;border:1px solid #333;border-radius:13px;padding:18px}
.file-label{display:block;text-align:center;padding:25px;border:2px dashed #555;border-radius:12px;color:#ddd;margin:12px 0}
.file-label input{display:none}
.preview{width:100%;max-height:350px;object-fit:contain;background:#000;border-radius:10px;display:none;margin-top:12px}
.profiletop{text-align:center;padding:15px 0}
.bigavatar{width:85px;height:85px;border-radius:50%;background:#292929;margin:auto;display:grid;place-items:center;font-size:32px}
.stats{display:flex;justify-content:center;gap:25px;margin:20px}
.stats div{text-align:center;color:#aaa;font-size:12px}
.stats strong{display:block;color:white;font-size:18px;margin-bottom:5px}
.profile-actions{display:flex;justify-content:center;gap:10px;margin:15px}
.userresult{display:flex;align-items:center;gap:12px;padding:14px 5px;border-bottom:1px solid #292929}
.avatar{width:40px;height:40px;border-radius:50%;background:#303030;display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.userinfo{flex:1;min-width:0;cursor:pointer}
.username{font-weight:bold;font-size:14px}
.handle{color:#888;font-size:12px;margin-top:4px}
.backbtn{background:none;border:0;color:white;font-size:15px;padding:10px 0}
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid-video{aspect-ratio:9/16;background:#171717;position:relative;overflow:hidden}
.grid-video video{width:100%;height:100%;object-fit:cover}
.grid-video button{position:absolute;inset:0;background:transparent;border:0}
.grid-video .delete-video{position:absolute;top:5px;left:5px;inset:auto;background:rgba(0,0,0,.7);color:white;border:0;border-radius:6px;padding:5px;font-size:11px}
.comment-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;align-items:flex-end;justify-content:center}
.comment-panel{background:#181818;width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:18px;max-height:70vh;display:flex;flex-direction:column}
.comment-list{overflow-y:auto;min-height:100px;max-height:40vh}
.comment-row{padding:10px 0;border-bottom:1px solid #333;font-size:13px;line-height:1.6}
.comment-form{display:flex;gap:7px}
.comment-form input{margin:5px 0}
.comment-form button{border:0;border-radius:8px;padding:0 14px;background:#eee;color:#111}
@media(max-width:400px){
.video-info{left:75px}
.video-actions{left:8px}
}
</style>
</head>
<body>
<header>
<button class="topbutton" onclick="logout()">خروج</button>
<div class="logo">RAB<span>DAN</span></div>
<button class="topbutton" onclick="loadExplore()">↻ تحديث</button>
</header>
<main>
<section id="authPage" class="page active">
<div class="authbox">
<div class="authlogo">RABDAN</div>
<p class="muted" style="text-align:center">مجتمعك، عالمك، مكانك.</p>
<div id="signupFields">
<input id="signupName" placeholder="اختَر اليوزر بالإنجليزي">
<p class="muted">من 3 إلى 20 حرفاً، ويسمح بالأرقام و _</p>
</div>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button class="primary" id="authButton" onclick="signup()">إنشاء حساب</button>
<button class="secondary" id="switchButton" onclick="switchAuth()">عندي حساب — تسجيل الدخول</button>
<div id="authMessage"></div>
</div>
</section>
<section id="explorePage" class="page">
<div id="videoFeed">
<div class="empty">جاري تحميل الفيديوهات...</div>
</div>
</section>
<section id="uploadPage" class="page">
<h2 class="sectiontitle">نشر فيديو جديد 🎥</h2>
<div class="upload-box">
<label class="file-label">
<span>＋ اختر فيديو من ألبومك</span>
<input type="file" id="videoFile" accept="video/*" onchange="previewVideo()">
</label>
<div id="fileName" class="muted"></div>
<video id="videoPreview" class="preview" controls playsinline></video>
<textarea id="videoCaption" maxlength="500" placeholder="اكتب وصف الفيديو..."></textarea>
<button class="primary" id="uploadButton" onclick="uploadVideo()">نشر الفيديو</button>
<div id="uploadMessage" class="muted"></div>
</div>
</section>
<section id="searchPage" class="page">
<h2 class="sectiontitle">البحث عن الأشخاص</h2>
<input id="searchInput" placeholder="ابحث باليوزر مثل rashid" oninput="searchUsers()">
<div class="muted">اكتب اليوزر بدون علامة @</div>
<div id="searchResults"></div>
</section>
<section id="profilePage" class="page">
<button class="backbtn" id="profileBack" onclick="backFromProfile()" style="display:none">‹ رجوع</button>
<div class="profiletop">
<div class="bigavatar" id="profileAvatar">R</div>
<h2 id="profileName">RABDAN</h2>
<p class="muted" id="profileUsername"></p>
<div class="stats">
<div><strong id="videoCount">0</strong>فيديوهات</div>
<div><strong id="followerCount">0</strong>متابعين</div>
<div><strong id="followingCount">0</strong>يتابع</div>
</div>
<div class="profile-actions" id="profileActions"></div>
<div id="ownProfileButtons" style="display:none">
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</div>
</div>
<h3>الفيديوهات</h3>
<div id="myVideos" class="video-grid"></div>
</section>
</main>
<nav class="bottom" id="navigation" style="display:none">
<button class="active" onclick="showPage('explorePage',this)">⌂</button>
<button onclick="showPage('searchPage',this)">⌕</button>
<button onclick="showPage('uploadPage',this)">＋</button>
<button onclick="showPage('profilePage',this)">◉</button>
</nav>
<div class="comment-overlay" id="commentOverlay" onclick="closeComments(event)">
<div class="comment-panel" onclick="event.stopPropagation()">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3>التعليقات</h3>
<button class="topbutton" onclick="closeComments()">✕</button>
</div>
<div id="commentList" class="comment-list"></div>
<div class="comment-form">
<input id="commentInput" placeholder="اكتب تعليقاً...">
<button onclick="addVideoComment()">إرسال</button>
</div>
</div>
</div>
<script>
const SUPABASE_URL="https://vhdzhnevsyxvvebqpqig.supabase.co";
const SUPABASE_KEY="sb_publishable_ykrE9V_vuL5LO4N2EXZ3EA_Bo2ZaMSG";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let currentProfile=null;
let viewedProfileId=null;
let isLogin=false;
let searchTimer=null;
let activeCommentVideo=null;
let videoObserver=null;
function safe(value){
return String(value??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}
function message(text){
document.getElementById('authMessage').innerText=text;
}
function switchAuth(){
isLogin=!isLogin;
document.getElementById('authButton').innerText=isLogin?'تسجيل الدخول':'إنشاء حساب';
document.getElementById('switchButton').innerText=isLogin?'إنشاء حساب جديد':'عندي حساب — تسجيل الدخول';
document.getElementById('signupFields').style.display=isLogin?'none':'block';
message('');
}
async function signup(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const name=document.getElementById('signupName').value.trim().toLowerCase();
const button=document.getElementById('authButton');
if(!email||!password){message('اكتب البريد الإلكتروني وكلمة المرور.');return}
if(password.length<6){message('كلمة المرور لازم تكون 6 أحرف على الأقل.');return}
if(!isLogin&&!name){message('اكتب اليوزر.');return}
if(!isLogin&&!/^[a-zA-Z0-9_]{3,20}$/.test(name)){
message('اليوزر لازم يكون من 3 إلى 20 حرفاً.');
return;
}
button.disabled=true;
message('جاري الاتصال...');
let result;
try{
if(isLogin){
result=await db.auth.signInWithPassword({email,password});
}else{
result=await db.auth.signUp({
email,password,
options:{data:{username:name,display_name:name}}
});
}
}catch(e){
button.disabled=false;
message('صار خطأ في الاتصال.');
return;
}
button.disabled=false;
if(result.error){
message('خطأ: '+result.error.message);
return;
}
if(!isLogin&&!result.data.session){
message('تم إنشاء الحساب! افحص بريدك الإلكتروني واضغط رابط التأكيد، وبعدها سجّل الدخول.');
return;
}
if(result.data.session)await startApp(result.data.user);
}
async function startApp(user){
currentUser=user;
await loadProfile();
if(!currentProfile)return;
document.getElementById('authPage').classList.remove('active');
document.getElementById('navigation').style.display='flex';
showPage('explorePage',document.querySelector('.bottom button'));
await loadExplore();
openSharedVideoFromUrl();
}
async function loadProfile(){
const {data,error}=await db.from('profiles')
.select('*').eq('id',currentUser.id).single();
if(error||!data){
alert('تعذر تحميل الملف الشخصي: '+(error?.message||''));
currentProfile=null;
return;
}
currentProfile=data;
}
function showPage(id,button){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));
if(button)button.classList.add('active');
if(id==='profilePage'){
document.getElementById('profileBack').style.display='none';
viewedProfileId=currentUser.id;
loadProfileView(currentUser.id);
}
if(id==='searchPage')document.getElementById('searchInput').focus();
if(id==='explorePage')loadExplore();
}
/* VIDEO EXPLORE */
function publicVideoUrl(path){
return db.storage.from('videos').getPublicUrl(path).data.publicUrl;
}
async function loadExplore(){
const container=document.getElementById('videoFeed');
container.innerHTML='<div class="empty">جاري تحميل الفيديوهات...</div>';
const {data:videos,error}=await db.from('videos')
.select('*').order('created_at',{ascending:false}).limit(50);
if(error){
container.innerHTML='<div class="empty">تعذر تحميل الفيديوهات: '+safe(error.message)+'</div>';
return;
}
if(!videos||!videos.length){
container.innerHTML='<div class="empty">ما في فيديوهات للحين 🎥<br>كن أول شخص ينشر فيديو في RABDAN!</div>';
return;
}
const ids=[...new Set(videos.map(v=>v.user_id))];
const videoIds=videos.map(v=>v.id);
const [{data:profiles},{data:likes},{data:comments},{data:follows}] = await Promise.all([
db.from('profiles').select('id,username,display_name').in('id',ids),
db.from('video_likes').select('video_id,user_id').in('video_id',videoIds),
db.from('video_comments').select('video_id').in('video_id',videoIds),
db.from('follows').select('following_id').eq('follower_id',currentUser.id).in('following_id',ids)
]);
const profileMap={};
(profiles||[]).forEach(p=>profileMap[p.id]=p);
const followed=new Set((follows||[]).map(f=>f.following_id));
container.innerHTML=videos.map(v=>{
const p=profileMap[v.user_id]||{};
const display=p.display_name||p.username||'مستخدم';
const postLikes=(likes||[]).filter(l=>l.video_id===v.id);
const liked=postLikes.some(l=>l.user_id===currentUser.id);
const commentCount=(comments||[]).filter(c=>c.video_id===v.id).length;
const following=followed.has(v.user_id);
const own=v.user_id===currentUser.id;
return `
<article class="video-card" data-video="${v.id}">
<video src="${safe(publicVideoUrl(v.video_path))}" autoplay muted loop playsinline preload="metadata"></video>
<div class="video-gradient"></div>
<div class="video-info">
<div class="video-user" onclick="openProfile('${v.user_id}')">@${safe(p.username||display)}</div>
<div class="video-caption">${safe(v.caption||'')}</div>
<div class="video-date">${new Date(v.created_at).toLocaleDateString('ar-AE')}</div>
${!own?`<button class="video-follow ${following?'following':''}" onclick="toggleFollow('${v.user_id}',${following})">${following?'تتابعه ✓':'متابعة +'}</button>`:''}
</div>
<div class="video-actions">
<button class="like-button" data-liked="${liked}" onclick="toggleVideoLike(this,'${v.id}')">${liked?'♥':'♡'}</button>
<small>${postLikes.length}</small>
<button onclick="openComments('${v.id}')">♧</button>
<small>${commentCount}</small>
<button class="sound-button" onclick="toggleSound(this)">🔇</button>
<button onclick="shareVideo('${v.id}')">↗</button>
<small>مشاركة</small>
</div>
</article>`;
}).join('');
setupVideoObserver();
}
function setupVideoObserver(){
if(videoObserver)videoObserver.disconnect();
videoObserver=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
const video=entry.target.querySelector('video');
if(!video)return;
if(entry.isIntersecting&&entry.intersectionRatio>=0.6){
video.play().catch(()=>{});
}else{
video.pause();
}
});
},{threshold:[0,.6,1]});
document.querySelectorAll('.video-card').forEach(card=>videoObserver.observe(card));
}
function toggleSound(button){
const card=button.closest('.video-card');
const video=card.querySelector('video');
video.muted=!video.muted;
button.innerText=video.muted?'🔇':'🔊';
}
/* FAST LIKE */
async function toggleVideoLike(button,videoId){
if(button.dataset.busy==='true')return;
const alreadyLiked=button.dataset.liked==='true';
const countElement=button.nextElementSibling;
const oldCount=parseInt(countElement.innerText,10)||0;
const newLiked=!alreadyLiked;
const newCount=Math.max(0,oldCount+(newLiked?1:-1));
button.dataset.busy='true';
button.dataset.liked=String(newLiked);
button.innerText=newLiked?'♥':'♡';
countElement.innerText=newCount;
try{
let result;
if(alreadyLiked){
result=await db.from('video_likes').delete()
.eq('video_id',videoId)
.eq('user_id',currentUser.id);
}else{
result=await db.from('video_likes').insert({
video_id:videoId,
user_id:currentUser.id
});
}
if(result.error){
button.dataset.liked=String(alreadyLiked);
button.innerText=alreadyLiked?'♥':'♡';
countElement.innerText=oldCount;
alert('تعذر حفظ اللايك: '+result.error.message);
}
}catch(error){
button.dataset.liked=String(alreadyLiked);
button.innerText=alreadyLiked?'♥':'♡';
countElement.innerText=oldCount;
alert('صار خطأ في الاتصال. حاول مرة ثانية.');
}
button.dataset.busy='false';
}
/* SHARE VIDEO */
async function shareVideo(videoId){
const shareUrl=location.origin+location.pathname+'?video='+encodeURIComponent(videoId);
try{
if(navigator.share){
await navigator.share({
title:'RABDAN',
text:'شاهد هذا الفيديو على RABDAN 🎥',
url:shareUrl
});
return;
}
if(navigator.clipboard&&window.isSecureContext){
await navigator.clipboard.writeText(shareUrl);
alert('تم نسخ رابط الفيديو! تقدر ترسله لربعك.');
return;
}
const temporary=document.createElement('textarea');
temporary.value=shareUrl;
temporary.style.position='fixed';
temporary.style.opacity='0';
document.body.appendChild(temporary);
temporary.select();
const copied=document.execCommand('copy');
temporary.remove();
if(copied){
alert('تم نسخ رابط الفيديو! تقدر ترسله لربعك.');
}else{
prompt('انسخ رابط الفيديو:',shareUrl);
}
}catch(error){
if(error.name!=='AbortError'){
alert('تعذرت المشاركة. حاول مرة ثانية.');
}
}
}
function openSharedVideoFromUrl(){
const videoId=new URLSearchParams(location.search).get('video');
if(!videoId)return;
setTimeout(()=>{
const card=document.querySelector(`[data-video="${CSS.escape(videoId)}"]`);
if(card){
card.scrollIntoView({behavior:'smooth'});
}
},500);
}
/* COMMENTS */
async function openComments(videoId){
activeCommentVideo=videoId;
document.getElementById('commentOverlay').style.display='flex';
document.getElementById('commentList').innerHTML='<div class="empty">جاري التحميل...</div>';
const {data,error}=await db.from('video_comments')
.select('*').eq('video_id',videoId)
.order('created_at',{ascending:true});
if(error){
document.getElementById('commentList').innerHTML='<div class="empty">تعذر تحميل التعليقات.</div>';
return;
}
if(!data||!data.length){
document.getElementById('commentList').innerHTML='<div class="empty">ما في تعليقات للحين.</div>';
return;
}
const ids=[...new Set(data.map(c=>c.user_id))];
const {data:profiles}=await db.from('profiles')
.select('id,username,display_name').in('id',ids);
const map={};
(profiles||[]).forEach(p=>map[p.id]=p);
document.getElementById('commentList').innerHTML=data.map(c=>{
const p=map[c.user_id]||{};
return `<div class="comment-row"><b>@${safe(p.username||p.display_name||'مستخدم')}</b><br>${safe(c.content)}</div>`;
}).join('');
}
function closeComments(event){
if(event&&event.target!==document.getElementById('commentOverlay'))return;
document.getElementById('commentOverlay').style.display='none';
activeCommentVideo=null;
}
async function addVideoComment(){
const input=document.getElementById('commentInput');
const content=input.value.trim();
if(!content||!activeCommentVideo)return;
const {error}=await db.from('video_comments').insert({
video_id:activeCommentVideo,
user_id:currentUser.id,
content
});
if(error){
alert('تعذر إرسال التعليق: '+error.message);
return;
}
input.value='';
await openComments(activeCommentVideo);
}
/* UPLOAD */
function previewVideo(){
const file=document.getElementById('videoFile').files[0];
const preview=document.getElementById('videoPreview');
const name=document.getElementById('fileName');
if(!file){
preview.style.display='none';
name.innerText='';
return;
}
if(!file.type.startsWith('video/')){
alert('اختَر ملف فيديو فقط.');
document.getElementById('videoFile').value='';
return;
}
if(file.size>50*1024*1024){
alert('حجم الفيديو أكبر من 50 MB. اختَر فيديو أصغر.');
document.getElementById('videoFile').value='';
return;
}
name.innerText=file.name;
preview.src=URL.createObjectURL(file);
preview.style.display='block';
}
async function uploadVideo(){
const file=document.getElementById('videoFile').files[0];
const caption=document.getElementById('videoCaption').value.trim();
const button=document.getElementById('uploadButton');
const msg=document.getElementById('uploadMessage');
if(!file){msg.innerText='اختَر فيديو أولاً.';return}
if(!file.type.startsWith('video/')){msg.innerText='الملف لازم يكون فيديو.';return}
if(file.size>50*1024*1024){msg.innerText='حجم الفيديو أكبر من 50 MB.';return}
button.disabled=true;
msg.innerText='جاري رفع الفيديو...';
const cleanName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const path=currentUser.id+'/'+Date.now()+'-'+cleanName;
const {error:uploadError}=await db.storage.from('videos')
.upload(path,file,{contentType:file.type,upsert:false});
if(uploadError){
button.disabled=false;
msg.innerText='تعذر رفع الفيديو: '+uploadError.message;
return;
}
const {error:insertError}=await db.from('videos').insert({
user_id:currentUser.id,
video_path:path,
caption
});
if(insertError){
await db.storage.from('videos').remove([path]);
button.disabled=false;
msg.innerText='تعذر حفظ بيانات الفيديو: '+insertError.message;
return;
}
document.getElementById('videoFile').value='';
document.getElementById('videoCaption').value='';
document.getElementById('fileName').innerText='';
document.getElementById('videoPreview').style.display='none';
document.getElementById('videoPreview').src='';
button.disabled=false;
msg.innerText='تم نشر الفيديو بنجاح! 🎉';
showPage('explorePage',document.querySelector('.bottom button'));
await loadExplore();
}
/* PROFILE */
async function loadProfileView(userId){
viewedProfileId=userId;
const {data:profile,error}=await db.from('profiles')
.select('*').eq('id',userId).single();
if(error||!profile){
alert('تعذر تحميل الحساب.');
return;
}
const isOwn=userId===currentUser.id;
document.getElementById('profileName').innerText=profile.display_name||profile.username||'مستخدم';
document.getElementById('profileUsername').innerText='@'+(profile.username||'');
document.getElementById('profileAvatar').innerText=(profile.display_name||profile.username||'R').charAt(0).toUpperCase();
document.getElementById('ownProfileButtons').style.display=isOwn?'block':'none';
document.getElementById('profileBack').style.display=isOwn?'none':'block';
const {data:videos,error:videoError}=await db.from('videos')
.select('*').eq('user_id',userId)
.order('created_at',{ascending:false});
if(videoError){
document.getElementById('myVideos').innerHTML='<div class="empty">تعذر تحميل الفيديوهات.</div>';
return;
}
const list=videos||[];
document.getElementById('videoCount').innerText=list.length;
const {count:followers}=await db.from('follows')
.select('*',{count:'exact',head:true}).eq('following_id',userId);
const {count:following}=await db.from('follows')
.select('*',{count:'exact',head:true}).eq('follower_id',userId);
document.getElementById('followerCount').innerText=followers||0;
document.getElementById('followingCount').innerText=following||0;
const actions=document.getElementById('profileActions');
if(isOwn){
actions.innerHTML='';
}else{
const {data:follow}=await db.from('follows')
.select('following_id')
.eq('follower_id',currentUser.id)
.eq('following_id',userId)
.maybeSingle();
const isFollowing=!!follow;
actions.innerHTML=`<button class="followbtn ${isFollowing?'following':''}" onclick="toggleFollow('${userId}',${isFollowing})">${isFollowing?'تتابعه ✓':'متابعة'}</button>`;
}
document.getElementById('myVideos').innerHTML=list.map(v=>`
<div class="grid-video">
<video src="${safe(publicVideoUrl(v.video_path))}" muted playsinline preload="metadata"></video>
<button onclick="openProfileVideo('${v.id}')"></button>
${isOwn?`<button class="delete-video" onclick="deleteVideo('${v.id}','${safe(v.video_path)}')">حذف</button>`:''}
</div>
`).join('')||'<div class="empty" style="grid-column:1/4">ما في فيديوهات للحين.</div>';
}
async function openProfileVideo(videoId){
showPage('explorePage',document.querySelector('.bottom button'));
await loadExplore();
setTimeout(()=>{
const card=document.querySelector(`[data-video="${CSS.escape(videoId)}"]`);
if(card)card.scrollIntoView({behavior:'smooth'});
},300);
}
async function deleteVideo(videoId,path){
if(!confirm('متأكد تبا تحذف الفيديو؟'))return;
const {error:storageError}=await db.storage.from('videos').remove([path]);
if(storageError){
alert('تعذر حذف ملف الفيديو: '+storageError.message);
return;
}
const {error}=await db.from('videos').delete()
.eq('id',videoId).eq('user_id',currentUser.id);
if(error){
alert('تعذر حذف بيانات الفيديو: '+error.message);
return;
}
await loadProfileView(currentUser.id);
}
async function openProfile(userId){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('profilePage').classList.add('active');
document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));
document.getElementById('profileName').innerText='جاري التحميل...';
document.getElementById('myVideos').innerHTML='<div class="empty">جاري التحميل...</div>';
await loadProfileView(userId);
}
function backFromProfile(){
showPage('searchPage',document.querySelectorAll('.bottom button')[1]);
}
/* SEARCH */
async function searchUsers(){
const input=document.getElementById('searchInput');
const results=document.getElementById('searchResults');
const query=input.value.trim().replace(/^@/,'');
clearTimeout(searchTimer);
if(!query){
results.innerHTML='<div class="empty">اكتب يوزر للبحث عنه.</div>';
return;
}
if(!/^[a-zA-Z0-9_]{1,20}$/.test(query)){
results.innerHTML='<div class="empty">اكتب يوزر صحيح.</div>';
return;
}
results.innerHTML='<div class="empty">جاري البحث...</div>';
searchTimer=setTimeout(async()=>{
const {data,error}=await db.from('profiles')
.select('id,username,display_name')
.ilike('username',query+'%').limit(20);
if(error){
results.innerHTML='<div class="empty">تعذر البحث: '+safe(error.message)+'</div>';
return;
}
if(!data||!data.length){
results.innerHTML='<div class="empty">ما حصلنا أي حساب.</div>';
return;
}
const ids=data.map(u=>u.id);
const {data:follows,error:followError}=await db.from('follows')
.select('following_id').eq('follower_id',currentUser.id).in('following_id',ids);
if(followError){
results.innerHTML='<div class="empty">تعذر تحميل المتابعة.</div>';
return;
}
const followingIds=(follows||[]).map(f=>f.following_id);
results.innerHTML=data.map(user=>{
const display=user.display_name||user.username||'مستخدم';
const isFollowing=followingIds.includes(user.id);
return `
<div class="userresult">
<div class="avatar" onclick="openProfile('${user.id}')">${safe(display.charAt(0).toUpperCase())}</div>
<div class="userinfo" onclick="openProfile('${user.id}')">
<div class="username">${safe(display)}</div>
<div class="handle">@${safe(user.username||'')}</div>
</div>
${user.id===currentUser.id?'<span class="muted">أنت</span>':`
<button class="followbtn ${isFollowing?'following':''}" onclick="toggleFollow('${user.id}',${isFollowing})">${isFollowing?'تتابعه ✓':'متابعة'}</button>`}
</div>`;
}).join('');
},350);
}
/* FOLLOW */
async function toggleFollow(userId,isFollowing){
if(userId===currentUser.id)return;
if(isFollowing){
const {error}=await db.from('follows').delete()
.eq('follower_id',currentUser.id).eq('following_id',userId);
if(error){
alert('تعذر إلغاء المتابعة: '+error.message);
return;
}
}else{
const {error}=await db.from('follows').insert({
follower_id:currentUser.id,
following_id:userId
});
if(error){
alert('تعذر المتابعة: '+error.message);
return;
}
}
if(document.getElementById('searchPage').classList.contains('active'))await searchUsers();
if(document.getElementById('profilePage').classList.contains('active'))await loadProfileView(viewedProfileId);
if(document.getElementById('explorePage').classList.contains('active'))await loadExplore();
}
/* LOGOUT */
async function logout(){
if(!currentUser)return;
await db.auth.signOut();
currentUser=null;
currentProfile=null;
document.getElementById('navigation').style.display='none';
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('authPage').classList.add('active');
}
async function init(){
const {data}=await db.auth.getSession();
if(data.session)await startApp(data.session.user);
}
db.auth.onAuthStateChange((event)=>{
if(event==='SIGNED_OUT'){
currentUser=null;
currentProfile=null;
}
});
init();
</script>
</body>
</html>
