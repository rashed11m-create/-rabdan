<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RABDAN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif;padding-bottom:85px}
header{height:65px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #242424;position:sticky;top:0;background:#090909;z-index:10}
.logo{font-size:25px;font-weight:900;letter-spacing:3px}
.logo span{color:#aaa}
button{cursor:pointer}
.icon{background:none;border:0;color:white;font-size:23px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:17px 14px;border-bottom:1px solid #222}
.story{min-width:66px;text-align:center;font-size:11px;color:#bbb}
.story img,.story .circle{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #aaa;padding:2px}
.circle{display:grid;place-items:center;background:#202020;font-size:25px}
main{max-width:520px;margin:auto}
.post{border-bottom:1px solid #292929;padding-bottom:15px;margin-bottom:15px}
.posthead{display:flex;align-items:center;gap:10px;padding:13px}
.avatar{width:39px;height:39px;border-radius:50%;background:#303030;display:grid;place-items:center;font-weight:bold;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.username{font-weight:bold;font-size:14px}
.time{color:#777;font-size:11px;margin-top:4px}
.postimg{width:100%;max-height:480px;object-fit:cover;background:#171717;display:block}
.caption{padding:10px 14px;font-size:14px;line-height:1.7}
.actions{display:flex;gap:17px;padding:5px 14px}
.actions button{background:none;border:0;color:white;font-size:23px}
.likes{padding:0 14px;font-size:13px;font-weight:bold}
.commentline{padding:7px 14px;color:#aaa;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:67px;background:#101010;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom button{background:none;border:0;color:#aaa;font-size:23px}
.bottom button.active{color:white}
.page{display:none;padding:18px}
.page.active{display:block}
.sectiontitle{font-size:22px;font-weight:bold;margin:10px 0 20px}
input,textarea{width:100%;padding:13px;background:#171717;border:1px solid #333;border-radius:10px;color:white;margin:8px 0;font-size:14px}
textarea{height:100px;resize:vertical}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:bold;font-size:15px;margin-top:10px}
.upload{display:block;background:#202020;padding:15px;border-radius:10px;text-align:center;margin:10px 0;color:#ccc}
.profiletop{text-align:center;padding:25px 0}
.bigavatar{width:90px;height:90px;border-radius:50%;background:#292929;margin:auto;display:grid;place-items:center;font-size:35px}
.stats{display:flex;justify-content:center;gap:35px;margin:20px}
.stats div{text-align:center;color:#aaa;font-size:12px}
.stats strong{display:block;color:white;font-size:18px;margin-bottom:5px}
.smallbtn{padding:9px 20px;border-radius:8px;background:#eee;border:0;font-weight:bold}
.searchresult{padding:13px;border-bottom:1px solid #292929;display:flex;align-items:center;gap:12px}
.empty{text-align:center;color:#777;padding:40px 10px}
</style>
</head>
<body>
<header>
<button class="icon" onclick="showPage('search')">⌕</button>
<div class="logo">RAB<span>DAN</span></div>
<button class="icon" onclick="showPage('create')">＋</button>
</header>
<main>
<div id="feedPage" class="page active" style="padding:0">
<div class="stories">
<div class="story"><div class="circle">＋</div><p>قصتك</p></div>
<div class="story"><div class="circle">R</div><p>RABDAN</p></div>
<div class="story"><div class="circle">A</div><p>Ahmed</p></div>
<div class="story"><div class="circle">M</div><p>Mohammed</p></div>
<div class="story"><div class="circle">S</div><p>Salem</p></div>
</div>
<div id="posts"></div>
</div>
<div id="createPage" class="page">
<div class="sectiontitle">إنشاء منشور</div>
<input id="caption" placeholder="شو في خاطرك؟">
<label class="upload">📷 اختر صورة من جهازك
<input type="file" id="photo" accept="image/*" style="display:none">
</label>
<img id="preview" style="width:100%;display:none;border-radius:12px;margin-top:10px">
<button class="primary" onclick="addPost()">نشر المنشور</button>
</div>
<div id="searchPage" class="page">
<div class="sectiontitle">استكشاف</div>
<input id="searchInput" placeholder="ابحث عن مستخدم..." oninput="searchUsers()">
<div id="searchResults"></div>
</div>
<div id="profilePage" class="page">
<div class="profiletop">
<div class="bigavatar">R</div>
<h2 id="profileName">RABDAN User</h2>
<p style="color:#888">@rabdan_user</p>
<div class="stats">
<div><strong id="postCount">0</strong>منشورات</div>
<div><strong id="followers">0</strong>متابعون</div>
<div><strong id="following">0</strong>يتابع</div>
</div>
<button class="smallbtn" onclick="editProfile()">تعديل الملف الشخصي</button>
</div>
<h3>منشوراتي</h3>
<div id="myPosts"></div>
</div>
<div id="notificationsPage" class="page">
<div class="sectiontitle">الإشعارات</div>
<div class="empty">ما عندك إشعارات حالياً 🔔</div>
</div>
</main>
<nav class="bottom">
<button class="active" onclick="showPage('feed')">⌂</button>
<button onclick="showPage('search')">⌕</button>
<button onclick="showPage('create')">＋</button>
<button onclick="showPage('notifications')">♡</button>
<button onclick="showPage('profile')">◉</button>
</nav>
<script>
let posts=JSON.parse(localStorage.getItem('rabdan_posts')||'[]');
let username=localStorage.getItem('rabdan_name')||'RABDAN User';
let selectedImage='';
const demo=[
{id:1,user:'RABDAN',caption:'مرحباً بكم في RABDAN 🚀 بداية مجتمعنا الجديد!',image:'',likes:12,liked:false,time:'منصة RABDAN'},
{id:2,user:'Ahmed',caption:'يوم جميل ✨',image:'',likes:8,liked:false,time:'منصة RABDAN'}
];
function save(){
localStorage.setItem('rabdan_posts',JSON.stringify(posts));
}
function showPage(name){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(name+'Page').classList.add('active');
document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));
const index={feed:0,search:1,create:2,notifications:3,profile:4}[name];
document.querySelectorAll('.bottom button')[index].classList.add('active');
if(name==='profile')renderProfile();
}
function renderPosts(){
let all=[...posts,...demo];
document.getElementById('posts').innerHTML=all.map(p=>`
<div class="post">
<div class="posthead">
<div class="avatar">${p.user[0]}</div>
<div><div class="username">${escapeHTML(p.user)}</div><div class="time">${p.time}</div></div>
</div>
${p.image?`<img class="postimg" src="${p.image}">`:''}
${p.caption?`<div class="caption">${escapeHTML(p.caption)}</div>`:''}
<div class="actions">
<button onclick="likePost(${p.id})">${p.liked?'♥':'♡'}</button>
<button onclick="commentPost()">♧</button>
<button onclick="sharePost()">↗</button>
</div>
<div class="likes">${p.likes} إعجاب</div>
<div class="commentline">كن أول من يعلّق...</div>
</div>`).join('');
}
function addPost(){
let caption=document.getElementById('caption').value.trim();
if(!caption&&!selectedImage){alert('اكتب شيئاً أو اختر صورة');return}
let post={id:Date.now(),user:username,caption,image:selectedImage,likes:0,liked:false,time:'الآن'};
posts.unshift(post);
save();
document.getElementById('caption').value='';
document.getElementById('photo').value='';
document.getElementById('preview').style.display='none';
selectedImage='';
renderPosts();
showPage('feed');
}
document.getElementById('photo').addEventListener('change',function(e){
let file=e.target.files[0];
if(!file)return;
if(file.size>3*1024*1024){alert('اختر صورة أقل من 3MB');return}
let reader=new FileReader();
reader.onload=function(){
selectedImage=reader.result;
document.getElementById('preview').src=selectedImage;
document.getElementById('preview').style.display='block';
};
reader.readAsDataURL(file);
});
function likePost(id){
let p=posts.find(x=>x.id===id);
if(p){p.liked=!p.liked;p.likes+=p.liked?1:-1;save();renderPosts()}
}
function commentPost(){alert('ميزة التعليقات بنضيفها في التحديث القادم ❤️')}
function sharePost(){if(navigator.share)navigator.share({title:'RABDAN',text:'شوف RABDAN!'});else alert('RABDAN ❤️')}
function renderProfile(){
document.getElementById('profileName').innerText=username;
document.getElementById('postCount').innerText=posts.filter(p=>p.user===username).length;
document.getElementById('myPosts').innerHTML=posts.filter(p=>p.user===username).map(p=>`
<div class="post"><div class="caption">${escapeHTML(p.caption)}</div>
${p.image?`<img class="postimg" src="${p.image}">`:''}</div>`).join('')||'<div class="empty">ما عندك منشورات بعد</div>';
}
function editProfile(){
let name=prompt('اكتب اسمك الجديد:',username);
if(name&&name.trim()){username=name.trim();localStorage.setItem('rabdan_name',username);renderProfile()}
}
function searchUsers(){
let q=document.getElementById('searchInput').value.toLowerCase();
let users=['RABDAN','Ahmed','Mohammed','Salem'];
document.getElementById('searchResults').innerHTML=users.filter(u=>u.toLowerCase().includes(q)).map(u=>`
<div class="searchresult"><div class="avatar">${u[0]}</div><b>${u}</b></div>`).join('');
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
renderPosts();
</script>
</body>
</html>
