<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RABDAN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif;padding-bottom:75px}
header{height:65px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;position:sticky;top:0;background:#090909;z-index:10}
.logo{font-size:25px;font-weight:900;letter-spacing:3px}
.logo span{color:#aaa}
button{cursor:pointer}
button:disabled{opacity:.5}
main{max-width:540px;margin:auto}
.page{display:none;padding:18px}
.page.active{display:block}
#feedPage{padding:0}
.sectiontitle{font-size:22px;font-weight:bold;margin:10px 0 20px}
input,textarea{width:100%;padding:14px;background:#171717;border:1px solid #333;border-radius:10px;color:white;margin:8px 0;font-size:15px}
textarea{height:110px;resize:vertical}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:bold;font-size:15px;margin-top:10px}
.secondary{width:100%;padding:13px;border:1px solid #555;border-radius:10px;background:transparent;color:white;margin-top:10px}
.authbox{padding:22px 18px;margin:30px 12px;background:#121212;border:1px solid #292929;border-radius:16px}
.authlogo{text-align:center;font-size:32px;font-weight:900;letter-spacing:4px;margin:15px}
.muted{color:#888;font-size:13px;line-height:1.7}
#authMessage{font-size:13px;color:#ccc;margin-top:12px;line-height:1.6}
.post{border-bottom:1px solid #292929;padding-bottom:15px;margin-bottom:15px}
.posthead{display:flex;align-items:center;gap:10px;padding:13px}
.avatar{width:40px;height:40px;border-radius:50%;background:#303030;display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.username{font-weight:bold;font-size:14px}
.handle{color:#888;font-size:12px;margin-top:4px}
.time{color:#777;font-size:11px;margin-top:4px}
.caption{padding:10px 14px;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:18px;padding:5px 14px}
.actions button{background:none;border:0;color:white;font-size:23px}
.likes{padding:0 14px;font-size:13px;font-weight:bold}
.commentline{padding:8px 14px;color:#aaa;font-size:13px}
.commentbox{display:flex;gap:7px;padding:5px 14px}
.commentbox input{margin:0;padding:10px;font-size:13px}
.commentbox button{background:#eee;color:#111;border:0;border-radius:8px;padding:0 13px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#101010;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom button{background:none;border:0;color:#aaa;font-size:23px}
.bottom button.active{color:white}
.empty{text-align:center;color:#777;padding:35px 10px}
.profiletop{text-align:center;padding:25px 0}
.bigavatar{width:85px;height:85px;border-radius:50%;background:#292929;margin:auto;display:grid;place-items:center;font-size:32px}
.stats{display:flex;justify-content:center;gap:25px;margin:20px}
.stats div{text-align:center;color:#aaa;font-size:12px}
.stats strong{display:block;color:white;font-size:18px;margin-bottom:5px}
.smallbtn{padding:10px 16px;border-radius:8px;background:#eee;color:#111;border:0;font-weight:bold}
.topbutton{background:none;border:0;color:white;font-size:13px}
.userresult{display:flex;align-items:center;gap:12px;padding:14px 5px;border-bottom:1px solid #292929}
.userinfo{flex:1;min-width:0}
.followbtn{padding:9px 13px;border-radius:8px;border:1px solid #555;background:transparent;color:white;font-weight:bold}
.followbtn.following{background:#eee;color:#111;border-color:#eee}
</style>
</head>
<body>
<header>
<button class="topbutton" onclick="logout()">تسجيل خروج</button>
<div class="logo">RAB<span>DAN</span></div>
<button class="topbutton" onclick="loadFeed()">↻ تحديث</button>
</header>
<main>
<section id="authPage" class="page active">
<div class="authbox">
<div class="authlogo">RABDAN</div>
<p class="muted" style="text-align:center">مجتمعك، عالمك، مكانك.</p>
<div id="signupFields">
<input id="signupName" placeholder="اختَر اليوزر بالإنجليزي">
<p class="muted">من 3 إلى 20 حرفاً، ويسمح بالأرقام و _</p>
</div>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

إنشاء حساب
عندي حساب — تسجيل الدخول

<div id="authMessage"></div>
</div>
</section>
<section id="feedPage" class="page">
<div style="padding:18px 15px;border-bottom:1px solid #292929">
<div class="sectiontitle">الرئيسية</div>
<textarea id="postText" placeholder="شو في خاطرك؟"></textarea>
<button class="primary" onclick="createPost()">نشر المنشور</button>
</div>
<div id="posts"><div class="empty">جاري تحميل المنشورات...</div></div>
</section>
<section id="searchPage" class="page">
<div class="sectiontitle">البحث عن الأشخاص</div>
<input id="searchInput" placeholder="ابحث باليوزر مثل rashid" oninput="searchUsers()">
<div class="muted">اكتب اليوزر بدون علامة @</div>
<div id="searchResults"></div>
</section>
<section id="profilePage" class="page">
<div class="profiletop">
<div class="bigavatar" id="profileAvatar">R</div>
<h2 id="profileName">RABDAN</h2>
<p class="muted" id="profileUsername"></p>
<div class="stats">
<div><strong id="postCount">0</strong>منشورات</div>
<div><strong id="followerCount">0</strong>متابعين</div>
<div><strong id="followingCount">0</strong>يتابع</div>
</div>

تعديل اليوزر

</div>

تسجيل الخروج

<h3>منشوراتي</h3>
<div id="myPosts"></div>
</section>
</main>
<nav class="bottom" id="navigation" style="display:none">
<button class="active" onclick="showPage('feedPage',this)">⌂</button>
<button onclick="showPage('searchPage',this)">⌕</button>
<button onclick="showPage('profilePage',this)">◉</button>
</nav>
<script>
const SUPABASE_URL = "https://vhdzhnevsyxvvebqpqig.supabase.co";
const SUPABASE_KEY = "sb_publishable_ykrE9V_vuL5LO4N2EXZ3EA_Bo2ZaMSG";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;
let currentProfile = null;
let isLogin = false;
let searchTimer = null;
function message(text){
document.getElementById('authMessage').innerText=text;
}
function switchAuth(){
isLogin=!isLogin;
document.getElementById('authButton').innerText=isLogin?'تسجيل الدخول':'إنشاء حساب';
document.getElementById('switchButton').innerText=isLogin?'إنشاء حساب جديد':'عندي حساب — تسجيل الدخول';
document.getElementById('signupFields').style.display=isLogin?'none':'block';
message('');
}
async function signup(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const name=document.getElementById('signupName').value.trim().toLowerCase();
const button=document.getElementById('authButton');
if(!email||!password){message('اكتب البريد الإلكتروني وكلمة المرور.');return}
if(password.length<6){message('كلمة المرور لازم تكون 6 أحرف على الأقل.');return}
if(!isLogin&&!name){message('اكتب اليوزر.');return}
if(!isLogin&&!/^[a-zA-Z0-9_]{3,20}$/.test(name)){
message('اليوزر لازم يكون بالإنجليزي أو الأرقام أو _، من 3 إلى 20 حرف.');return;
}
button.disabled=true;
message('جاري الاتصال...');
let result;
try{
if(isLogin){
result=await db.auth.signInWithPassword({email,password});
}else{
result=await db.auth.signUp({
email,
password,
options:{data:{username:name,display_name:name}}
});
}
}catch(e){
button.disabled=false;
message('صار خطأ في الاتصال. حاول مرة ثانية.');
return;
}
button.disabled=false;
if(result.error){
message('خطأ: '+result.error.message);
return;
}
if(!isLogin&&!result.data.session){
message('تم إنشاء الحساب! افحص بريدك الإلكتروني واضغط رابط التأكيد، وبعدها سجّل الدخول.');
return;
}
if(result.data.session){
await startApp(result.data.user);
}
}
async function startApp(user){
currentUser=user;
await loadProfile();
if(!currentProfile){
alert('ما قدرنا نحمل بيانات حسابك. حاول تحديث الصفحة.');
return;
}
document.getElementById('authPage').classList.remove('active');
document.getElementById('feedPage').classList.add('active');
document.getElementById('navigation').style.display='flex';
await loadFeed();
}
async function loadProfile(){
const {data,error}=await db.from('profiles')
.select('*').eq('id',currentUser.id).single();
if(error){
console.error(error);
alert('تعذر تحميل الملف الشخصي: '+error.message);
currentProfile=null;
return;
}
currentProfile=data;
}
function showPage(id,button){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));
if(button)button.classList.add('active');
if(id==='profilePage')loadMyProfile();
if(id==='searchPage')document.getElementById('searchInput').focus();
}
async function createPost(){
const input=document.getElementById('postText');
const content=input.value.trim();
if(!content){alert('اكتب شيئاً قبل النشر');return}
const {error}=await db.from('posts').insert({
user_id:currentUser.id,
content:content
});
if(error){alert('تعذر النشر: '+error.message);return}
input.value='';
await loadFeed();
alert('تم نشر منشورك بنجاح! 🎉');
}
async function loadFeed(){
const container=document.getElementById('posts');
container.innerHTML='<div class="empty">جاري تحميل المنشورات...</div>';
const {data:posts,error}=await db.from('posts')
.select('*').order('created_at',{ascending:false}).limit(50);
if(error){
container.innerHTML='<div class="empty">خطأ في تحميل المنشورات: '+safe(error.message)+'</div>';
return;
}
if(!posts.length){
container.innerHTML='<div class="empty">ما في منشورات للحين. كن أول شخص ينشر! ✨</div>';
return;
}
const ids=[...new Set(posts.map(p=>p.user_id))];
const {data:profiles}=await db.from('profiles')
.select('id,username,display_name').in('id',ids);
const {data:likes}=await db.from('likes')
.select('post_id,user_id').in('post_id',posts.map(p=>p.id));
const {data:comments}=await db.from('comments')
.select('id,post_id,user_id,content,created_at')
.in('post_id',posts.map(p=>p.id))
.order('created_at',{ascending:true});
const profileMap={};
(profiles||[]).forEach(p=>profileMap[p.id]=p);
container.innerHTML=posts.map(p=>{
const profile=profileMap[p.user_id]||{};
const userName=profile.display_name||profile.username||'مستخدم';
const handle=profile.username?'@'+profile.username:'';
const postLikes=(likes||[]).filter(l=>l.post_id===p.id);
const liked=postLikes.some(l=>l.user_id===currentUser.id);
const postComments=(comments||[]).filter(c=>c.post_id===p.id);
return `
<article class="post">
<div class="posthead">
<div class="avatar">${safe(userName.charAt(0).toUpperCase())}</div>
<div>
<div class="username">${safe(userName)}</div>
<div class="handle">${safe(handle)}</div>
<div class="time">${new Date(p.created_at).toLocaleString('ar-AE')}</div>
</div>
</div>
<div class="caption">${safe(p.content||'')}</div>
<div class="actions">
<button onclick="toggleLike('${p.id}',${liked})">${liked?'♥':'♡'}</button>
<button onclick="focusComment('${p.id}')">♧</button>
</div>
<div class="likes">${postLikes.length} إعجاب</div>
${postComments.map(c=>{
const cp=profileMap[c.user_id]||{};
return `<div class="commentline"><b>${safe(cp.username?'@'+cp.username:cp.display_name||'مستخدم')}:</b> ${safe(c.content)}</div>`;
}).join('')}
<div class="commentbox">
<input id="comment-${p.id}" placeholder="اكتب تعليقاً...">
<button onclick="addComment('${p.id}')">إرسال</button>
</div>
</article>`;
}).join('');
}
async function toggleLike(postId,alreadyLiked){
if(alreadyLiked){
const {error}=await db.from('likes').delete()
.eq('post_id',postId).eq('user_id',currentUser.id);
if(error){alert(error.message);return}
}else{
const {error}=await db.from('likes').insert({
post_id:postId,user_id:currentUser.id
});
if(error){alert(error.message);return}
}
await loadFeed();
}
function focusComment(id){
document.getElementById('comment-'+id)?.focus();
}
async function addComment(postId){
const input=document.getElementById('comment-'+postId);
const content=input.value.trim();
if(!content)return;
const {error}=await db.from('comments').insert({
post_id:postId,
user_id:currentUser.id,
content
});
if(error){alert('تعذر إضافة التعليق: '+error.message);return}
await loadFeed();
}
async function loadMyProfile(){
if(!currentProfile)await loadProfile();
if(!currentProfile)return;
const name=currentProfile.display_name||currentProfile.username||'RABDAN';
document.getElementById('profileName').innerText=name;
document.getElementById('profileUsername').innerText='@'+(currentProfile.username||'');
document.getElementById('profileAvatar').innerText=name.charAt(0).toUpperCase();
const {data:posts}=await db.from('posts')
.select('*').eq('user_id',currentUser.id)
.order('created_at',{ascending:false});
const myPosts=posts||[];
document.getElementById('postCount').innerText=myPosts.length;
const {count:followers}=await db.from('follows')
.select('*',{count:'exact',head:true})
.eq('following_id',currentUser.id);
const {count:following}=await db.from('follows')
.select('*',{count:'exact',head:true})
.eq('follower_id',currentUser.id);
document.getElementById('followerCount').innerText=followers||0;
document.getElementById('followingCount').innerText=following||0;
let totalLikes=0;
for(const post of myPosts){
const {count}=await db.from('likes')
.select('*',{count:'exact',head:true})
.eq('post_id',post.id);
totalLikes+=count||0;
}
document.getElementById('likeCount').innerText=totalLikes;
document.getElementById('myPosts').innerHTML=myPosts.map(p=>`
<div class="post">
<div class="caption">${safe(p.content)}</div>
<div class="time" style="padding:0 14px">${new Date(p.created_at).toLocaleString('ar-AE')}</div>
</div>
`).join('')||'<div class="empty">ما عندك منشورات للحين.</div>';
}
async function editUsername(){
const oldName=currentProfile.username||'';
const name=prompt('اكتب اليوزر الجديد بدون @:',oldName);
if(name===null)return;
const newName=name.trim().toLowerCase();
if(!/^[a-zA-Z0-9_]{3,20}$/.test(newName)){
alert('اليوزر لازم يكون من 3 إلى 20 حرفاً، وبالإنجليزي أو الأرقام أو _.');
return;
}
if(newName===oldName){
alert('هذا هو يوزرك الحالي.');
return;
}
const {error}=await db.from('profiles')
.update({username:newName})
.eq('id',currentUser.id);
if(error){
if(error.code==='23505'||error.message.toLowerCase().includes('duplicate')){
alert('هذا اليوزر مستخدم من شخص ثاني. اختَر غيره.');
}else{
alert('تعذر تعديل اليوزر: '+error.message);
}
return;
}
await loadProfile();
await loadMyProfile();
alert('تم تحديث اليوزر بنجاح! 🔥');
}
async function toggleFollow(userId,isFollowing){
if(userId===currentUser.id){
alert('ما تقدر تتابع نفسك!');
return;
}
if(isFollowing){
const {error}=await db.from('follows')
.delete()
.eq('follower_id',currentUser.id)
.eq('following_id',userId);
if(error){
alert('تعذر إلغاء المتابعة: '+error.message);
return;
}
}else{
const {error}=await db.from('follows').insert({
follower_id:currentUser.id,
following_id:userId
});
if(error){
alert('تعذر المتابعة: '+error.message);
return;
}
}
await searchUsers();
if(document.getElementById('profilePage').classList.contains('active')){
await loadMyProfile();
}
}
async function searchUsers(){
const input=document.getElementById('searchInput');
const results=document.getElementById('searchResults');
const query=input.value.trim().replace(/^@/, '');
clearTimeout(searchTimer);
if(!query){
results.innerHTML='<div class="empty">اكتب يوزر للبحث عنه.</div>';
return;
}
if(!/^[a-zA-Z0-9_]{1,20}$/.test(query)){
results.innerHTML='<div class="empty">اكتب يوزر صحيح.</div>';
return;
}
results.innerHTML='<div class="empty">جاري البحث...</div>';
searchTimer=setTimeout(async()=>{
const {data,error}=await db.from('profiles')
.select('id,username,display_name')
.ilike('username',query+'%')
.limit(20);
if(error){
results.innerHTML='<div class="empty">تعذر البحث: '+safe(error.message)+'</div>';
return;
}
if(!data||!data.length){
results.innerHTML='<div class="empty">ما حصلنا أي حساب بهذا اليوزر.</div>';
return;
}
const ids=data.map(u=>u.id);
const {data:follows, error:followError}=await db.from('follows')
.select('following_id')
.eq('follower_id',currentUser.id)
.in('following_id',ids);
if(followError){
results.innerHTML='<div class="empty">تعذر تحميل حالة المتابعة: '+safe(followError.message)+'</div>';
return;
}
const followingIds=(follows||[]).map(f=>f.following_id);
results.innerHTML=data.map(user=>{
const display=user.display_name||user.username||'مستخدم';
const isFollowing=followingIds.includes(user.id);
return `
<div class="userresult">
<div class="avatar">${safe(display.charAt(0).toUpperCase())}</div>
<div class="userinfo">
<div class="username">${safe(display)}</div>
<div class="handle">@${safe(user.username||'')}</div>
</div>
${user.id===currentUser.id
? '<span class="muted">أنت</span>'
: `<button class="followbtn ${isFollowing?'following':''}" onclick="toggleFollow('${user.id}',${isFollowing})">
${isFollowing?'تتابعه ✓':'متابعة'}
</button>`}
</div>`;
}).join('');
},350);
}
async function logout(){
if(!currentUser)return;
await db.auth.signOut();
currentUser=null;
currentProfile=null;
document.getElementById('navigation').style.display='none';
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('authPage').classList.add('active');
}
function safe(value){
return String(value??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}
async function init(){
const {data}=await db.auth.getSession();
if(data.session){
await startApp(data.session.user);
}
}
db.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_OUT'){
currentUser=null;
currentProfile=null;
}
});
init();
</script>
</body>
</html>
